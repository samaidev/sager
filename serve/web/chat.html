<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGER · Sage-A1.5 on T4</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #3fb950; --accent2: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: baseline; gap: 12px;
           padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 2px; }
  header .tag { color: var(--dim); font-size: 12px; }
  header .live { margin-left: auto; font-size: 12px; color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 18px 20px;
         display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 860px; width: 100%; margin: 0 auto; line-height: 1.6;
         font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--dim); letter-spacing: 1px;
              margin-bottom: 4px; }
  .msg.user { border-left: 2px solid var(--accent2); padding-left: 12px; }
  .msg.bot  { border-left: 2px solid var(--accent);  padding-left: 12px; }
  .msg.bot.thinking .who::after { content: " ▍"; color: var(--accent);
                                  animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--border); padding: 14px 20px; }
  #bar { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; width: 100%; }
  #in { flex: 1; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 14px; font: inherit; font-size: 14px; resize: none;
        outline: none; }
  #in:focus { border-color: var(--accent2); }
  #send { background: var(--accent); color: #06120a; border: 0;
          border-radius: 8px; padding: 0 22px; font: inherit; font-weight: 700;
          cursor: pointer; }
  #send:disabled { opacity: .4; cursor: default; }
  #stats { max-width: 860px; margin: 8px auto 0; color: var(--dim);
           font-size: 11px; min-height: 14px; }
</style>
</head>
<body>
<header>
  <h1>SAGER</h1>
  <span class="tag">Sage-A1.5 35B-A3B · Q4_K · 1× Tesla T4</span>
  <span class="live" id="live">connecting…</span>
</header>
<div id="log"></div>
<footer>
  <div id="bar">
    <textarea id="in" rows="1" placeholder="Say something… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">SEND</button>
  </div>
  <div id="stats"></div>
</footer>
<script>
const log = document.getElementById('log');
const input = document.getElementById('in');
const sendBtn = document.getElementById('send');
const statsEl = document.getElementById('stats');
const liveEl = document.getElementById('live');
let busy = false;

fetch('/props').then(r => r.json()).then(p => {
  liveEl.textContent = p.engine
    ? `online · ${p.engine.experts} experts · cache ${(100*(p.stats.cache_hit_rate??1)).toFixed(0)}%`
    : 'offline';
}).catch(() => liveEl.textContent = 'offline');

function add(cls, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = `<div class="who">${who}</div><div class="txt"></div>`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d.querySelector('.txt');
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = '';
  add('user', 'YOU').textContent = text;
  const bot = add('bot thinking', 'SAGE-A1.5');
  const t0 = performance.now();
  let ntok = 0;

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        messages: [{role: 'user', content: text}],
        stream: true, sager_session: 'web',
        temperature: 1.0, top_k: 20, top_p: 0.95, presence_penalty: 1.5,
        max_tokens: 1024
      })
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!chunk.startsWith('data: ')) continue;
        const payload = chunk.slice(6);
        if (payload === '[DONE]') continue;
        const j = JSON.parse(payload);
        if (j.error) { bot.textContent += `\n[error] ${j.error}`; continue; }
        const d = j.choices?.[0]?.delta?.content;
        if (d) { bot.textContent += d; ntok++; log.scrollTop = log.scrollHeight; }
      }
    }
  } catch (e) {
    bot.textContent += `\n[connection error] ${e}`;
  }
  bot.parentElement.classList.remove('thinking');
  const dt = (performance.now() - t0) / 1000;
  statsEl.textContent = `${ntok} tokens · ${(ntok/dt).toFixed(1)} tok/s · ${dt.toFixed(1)}s`;
  busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
